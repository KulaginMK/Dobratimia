<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DASS-21 — вопрос</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dobratimia/tokens.css">
<link rel="stylesheet" href="ds/dobratimia/components/bundle.css">
<script src="ds/dobratimia/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Nunito:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--color\.primary)}a:hover{color:var(--color\.primaryPressed)}
.scr{width:412px;height:915px;box-sizing:border-box;background:var(--color\.background);color:var(--color\.text);font-family:"Golos Text",system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden}
.h1{margin:0;font-family:Nunito,"Golos Text",sans-serif;font-size:28px;line-height:36px;font-weight:900}
.h3{margin:0;font-family:Nunito,"Golos Text",sans-serif;font-size:18px;line-height:24px;font-weight:800}
.cap{font-size:14px;line-height:20px;color:var(--color\.textMuted)}
.top{display:flex;align-items:center;gap:4px;padding:24px 12px 0 4px;height:56px}
.ibtn{width:48px;height:48px;border:none;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--color\.text);cursor:pointer;padding:0;flex-shrink:0}
.sos{height:48px;padding:0 16px;border:none;border-radius:24px;background:var(--color\.sos);color:var(--color\.onSos);font:700 15px "Golos Text",sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;flex-shrink:0}
.ans{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border-radius:18px;border:1.5px solid var(--color\.border);background:var(--color\.surface);text-align:left;cursor:pointer;font:500 16px/22px "Golos Text",sans-serif;color:var(--color\.text);box-sizing:border-box}
.ans.on{border-color:var(--color\.primary);background:var(--color\.primarySoft);color:var(--color\.onPrimarySoft);font-weight:600}
.radio{width:24px;height:24px;border-radius:12px;border:2px solid var(--color\.borderStrong);flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.ans.on .radio{border-color:var(--color\.primary)}
.ans.on .radio::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--color\.primary)}
.num{width:28px;font:900 15px Nunito,sans-serif;color:var(--color\.textMuted);flex-shrink:0;text-align:center}
</style>
</helmet>
<div class="scr">
  <div class="top">
    <a class="ibtn" href="Home.dc.html" aria-label="Прервать тест"><x-import component-from-global-scope="Dobratimia.Icon" name="close" size="22"></x-import></a>
    <h1 class="h3" style="flex-grow: 1">DASS-21</h1>
    <a class="sos" href="Sos.dc.html"><x-import component-from-global-scope="Dobratimia.Icon" name="sos" size="20"></x-import>SOS</a>
  </div>
  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between" class="cap"><span>Вопрос 7 из 21</span><span>≈ 3 минуты</span></div>
    <div style="height: 8px; border-radius: 4px; background: var(--color\.surfaceAlt); overflow: hidden" role="progressbar" aria-valuemin="0" aria-valuemax="21" aria-valuenow="7" aria-label="Прогресс теста"><div style="width: 33%; height: 8px; border-radius: 4px; background: var(--color\.primary)"></div></div>
  </div>
  <div style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <span class="cap">Насколько это подходило вам за последнюю неделю?</span>
    <h2 class="h1">Мне было трудно успокоиться и расслабиться</h2>
  </div>
  <div role="radiogroup" aria-label="Ответ" style="display: flex; flex-direction: column; gap: 10px; padding: 28px 20px 0">
    <sc-for list="{{answers}}" as="a" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{a.checked}}" class="{{a.cls}}" onClick="{{a.pick}}"><span class="radio"></span><span style="flex-grow: 1">{{a.text}}</span><span class="num">{{a.n}}</span></button>
    </sc-for>
  </div>
  <div class="cap" style="padding: 16px 24px 0">Здесь нет правильных ответов. Отвечайте так, как было на самом деле.</div>
  <div style="margin-top: auto; padding: 0 20px 28px; display: flex; gap: 12px">
    <div style="flex: 1"><x-import component-from-global-scope="Dobratimia.Button" variant="outline" size="lg" full-width="{{yes}}" icon="chevronLeft">Назад</x-import></div>
    <div style="flex: 2"><x-import component-from-global-scope="Dobratimia.Button" variant="primary" size="lg" full-width="{{yes}}" icon-right="chevronRight" href="DassResult.dc.html">Дальше</x-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
renderVals() {
const sel = this.state && this.state.sel !== undefined ? this.state.sel : 2;
const texts = ['Совсем не подходило', 'Подходило немного или иногда', 'Подходило заметно или часто', 'Очень подходило или почти всегда'];
return {
  yes: true,
  answers: texts.map((t, i) => ({
    text: t, n: String(i),
    checked: i === sel ? 'true' : 'false',
    cls: i === sel ? 'ans on' : 'ans',
    pick: () => this.setState({ sel: i })
  }))
};
}
}
</script>
</body>
</html>
