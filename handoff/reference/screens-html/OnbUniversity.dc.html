<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — выбор вуза</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dobratimia/tokens.css">
<link rel="stylesheet" href="ds/dobratimia/components/bundle.css">
<script src="ds/dobratimia/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Nunito:wght@700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:var(--color\.primary)}a:hover{color:var(--color\.primaryPressed)}
.scr{width:412px;height:915px;box-sizing:border-box;background:var(--color\.background);color:var(--color\.text);font-family:"Golos Text",system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden}
.h1{margin:0;font-family:Nunito,"Golos Text",sans-serif;font-size:28px;line-height:36px;font-weight:900}
.cap{font-size:14px;line-height:20px;color:var(--color\.textMuted)}
.txt{font-size:16px;line-height:24px}
.steps{display:flex;gap:6px;flex-grow:1}
.step{height:6px;border-radius:3px;flex-grow:1;background:var(--color\.border)}
.step.on{background:var(--color\.primary)}
.ibtn{width:48px;height:48px;border:none;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--color\.text);cursor:pointer;padding:0;flex-shrink:0}
.uni{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 16px;border-radius:18px;border:1.5px solid var(--color\.border);background:var(--color\.surface);text-align:left;cursor:pointer;font-family:"Golos Text",sans-serif;color:var(--color\.text);box-sizing:border-box}
.uni.on{border-color:var(--color\.primary);background:var(--color\.primarySoft)}
.radio{width:24px;height:24px;border-radius:12px;border:2px solid var(--color\.borderStrong);flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.uni.on .radio{border-color:var(--color\.primary)}
.uni.on .radio::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--color\.primary)}
.abbr{font:800 16px Nunito,"Golos Text",sans-serif}
</style>
</helmet>
<div class="scr">
  <div style="display: flex; align-items: center; gap: 12px; padding: 24px 20px 0 4px; height: 56px">
    <a class="ibtn" href="OnbSignIn.dc.html" aria-label="Назад"><x-import component-from-global-scope="Dobratimia.Icon" name="chevronLeft" size="26"></x-import></a>
    <div class="steps" aria-label="Шаг 5 из 5"><span class="step on"></span><span class="step on"></span><span class="step on"></span><span class="step on"></span><span class="step on"></span></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 24px 20px 0">
    <h1 class="h1">Где вы учитесь?</h1>
    <p class="txt" style="margin: 0; color: var(--color\.textMuted)">Покажем контакты психологической службы вашего вуза в SOS. Поменять можно в профиле.</p>
  </div>
  <div style="padding: 18px 20px 0">
    <x-import component-from-global-scope="Dobratimia.TextField" label="Поиск" placeholder="Название или город"></x-import>
  </div>
  <div role="radiogroup" aria-label="Вуз" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 0">
    <sc-for list="{{unis}}" as="u" hint-placeholder-count="6">
      <button type="button" role="radio" aria-checked="{{u.checked}}" class="{{u.cls}}" onClick="{{u.pick}}">
        <span class="radio"></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span class="abbr">{{u.abbr}}</span><span class="cap">{{u.name}}</span></span>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 4px">
    <x-import component-from-global-scope="Dobratimia.Button" variant="primary" size="lg" full-width="{{yes}}" href="Home.dc.html">Готово</x-import>
    <x-import component-from-global-scope="Dobratimia.Button" variant="text" full-width="{{yes}}" href="Home.dc.html">Выберу позже</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
renderVals() {
const sel = this.state && this.state.sel !== undefined ? this.state.sel : 0;
const list = [
  { abbr: 'ВГМУ', name: 'Витебский государственный медицинский университет' },
  { abbr: 'БГМУ', name: 'Белорусский государственный медицинский университет' },
  { abbr: 'ГрГМУ', name: 'Гродненский государственный медицинский университет' },
  { abbr: 'ГомГМУ', name: 'Гомельский государственный медицинский университет' },
  { abbr: 'Другой вуз', name: 'Укажу позже или выберу общий список служб' }
];
return {
  yes: true,
  unis: list.map((u, i) => Object.assign({}, u, {
    checked: i === sel ? 'true' : 'false',
    cls: i === sel ? 'uni on' : 'uni',
    pick: () => this.setState({ sel: i })
  }))
};
}
}
</script>
</body>
</html>
