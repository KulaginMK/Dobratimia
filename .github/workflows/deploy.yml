name: Веб-версия на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    env:
      # Не секреты: эти значения и так видны в коде собранного сайта.
      # Задаются в Settings → Secrets and variables → Actions → Variables (см. PUBLISH.md).
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # Сайт лежит в подпапке с именем репозитория: https://<аккаунт>.github.io/<репозиторий>/
      WEB_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
      - run: npx expo export -p web
      # Прямые ссылки (/dass, /auth/callback) GitHub Pages отдаёт через 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: expo-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
